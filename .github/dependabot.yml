# Weekly update checks. Actions are pinned to commit SHAs; Dependabot updates the SHA and the "# vX.Y.Z" comment.
# Python requirements are pinned with hashes; Dependabot updates version and hashes together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Deps"
