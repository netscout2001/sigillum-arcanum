name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-pip.txt
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-windows.txt
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q tests

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
