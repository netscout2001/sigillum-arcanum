name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-pip.txt
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-windows.txt
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run language tests in English
        env:
          SIGILLUM_LANG: en
        run: python -m pytest -q tests/test_i18n.py tests/test_gui_base.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
