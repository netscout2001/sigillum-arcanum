name: release

# After every green test run of a push to main:
#  1. Create a release for the version in sigillum/__init__.py (if it does not exist yet),
#     notes from the matching section of CHANGELOG.md, ZIP + SHA-256 attached.
#  2. Delete branches that are fully contained in main or whose pull request was merged.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only for a successful test run triggered by a PUSH to main in THIS repository – never for pull requests
    # (a fork's branch may also be called "main") – or for a manual start from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Create release if the version is new
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([0-9.]+)\"', open('sigillum/__init__.py').read()).group(1))")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi
          awk -v v="$VERSION" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md hat keinen Abschnitt '## $VERSION'"; exit 1; }
          NAME="SigillumArcanum-$VERSION"
          git archive --format=zip --prefix="$NAME/" -o "$NAME.zip" "$SHA"
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          gh release create "$TAG" "$NAME.zip" "$NAME.zip.sha256" --repo "$REPO" --target "$SHA" \
            --title "Sigillum Arcanum $VERSION" --notes-file notes.md

      - name: Delete merged branches
        run: |
          set -euo pipefail
          for b in $(gh api "repos/$REPO/branches?per_page=100" --jq '.[].name'); do
            [ "$b" = "main" ] && continue
            ahead=$(gh api "repos/$REPO/compare/main...$b" --jq .ahead_by)
            merged=$(gh api "repos/$REPO/pulls?state=closed&head=${REPO%%/*}:$b&per_page=100" --jq '[.[] | select(.merged_at != null)] | length')
            open=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$b" --jq 'length')
            if [ "$open" = "0" ] && { [ "$ahead" = "0" ] || [ "$merged" != "0" ]; }; then
              echo "Lösche Branch $b"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
            fi
          done
